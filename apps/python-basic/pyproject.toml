[project]
name = "python-basic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "borderf", email = "15653771198@163.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "openai>=2.38.0",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.48.0",
]

[project.scripts]
python-basic = "python_basic:main"

[[tool.uv.index]]
url = "http://mirrors.aliyun.com/pypi/simple"
default = true

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
